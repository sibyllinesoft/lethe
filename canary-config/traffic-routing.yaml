apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: lethe-hybrid-canary
  namespace: lethe-production
spec:
  hosts:
  - lethe-api.production.internal
  http:
  - match:
    - headers:
        x-canary-hybrid:
          exact: "true"
    route:
    - destination:
        host: lethe-hybrid-service
        port:
          number: 8080
      weight: 100
  - route:
    - destination:
        host: lethe-hybrid-service
        port:
          number: 8080
      weight: 5
    - destination:
        host: lethe-streaming-service
        port:
          number: 8080
      weight: 95
  fault:
    abort:
      percentage:
        value: 0.1
      httpStatus: 503
    delay:
      percentage:
        value: 0.1
      fixedDelay: 5s
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: lethe-hybrid-canary-circuit-breaker
  namespace: lethe-production
spec:
  host: lethe-hybrid-service
  trafficPolicy:
    circuitBreaker:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 2
