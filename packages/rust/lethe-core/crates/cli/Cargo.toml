[package]
name = "lethe-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lethe"
path = "src/main.rs"

[dependencies]
# Shared types and domain/infrastructure
lethe-shared = { path = "../shared" }
lethe-domain = { path = "../domain" }
lethe-infrastructure = { path = "../infrastructure", default-features = false, features = ["database"] }

# HTTP server & routing
axum.workspace = true
# CLI framework
clap.workspace = true

# HTTP tooling for local server launch
tower.workspace = true
tower-http.workspace = true

# Database
sqlx.workspace = true

# Core dependencies from workspace
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true

# Async traits
async-trait = "0.1"

# Configuration
config.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File I/O
walkdir = "2.3"

# Terminal UI
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"

# Pretty printing
tabled = "0.15"
serde_yaml = "0.9"

# HTTP client for API testing
reqwest.workspace = true

# Additional dependencies
glob = "0.3"
toml = "0.8"
terminal_size = "0.3"
tempfile = "3.8"

# API dependencies
lethe-api = { path = "../api" }
