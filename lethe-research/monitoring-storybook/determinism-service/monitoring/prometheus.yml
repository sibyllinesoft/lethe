global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'determinism-service'
    environment: 'development'

rule_files:
  - "determinism_alerts.yml"

scrape_configs:
  - job_name: 'determinism-service'
    static_configs:
      - targets: ['determinism-service:9090']
    scrape_interval: 10s
    metrics_path: /metrics
    honor_labels: true
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

