groups:
  - name: determinism_service
    interval: 30s
    rules:
      # Determinism Success Rate Alerts
      - alert: DeterminismSuccessRateLow
        expr: rate(determinism_successful_replays_total[5m]) / rate(determinism_total_replays_total[5m]) < 0.99
        for: 2m
        labels:
          severity: critical
          service: determinism-service
        annotations:
          summary: "Determinism success rate is below 99%"
          description: "The determinism success rate has been {{ $value | humanizePercentage }} for more than 2 minutes. Current rate: {{ $value }}."
          runbook_url: "https://docs.example.com/runbooks/determinism-failures"

      - alert: DeterminismSuccessRateVeryLow
        expr: rate(determinism_successful_replays_total[5m]) / rate(determinism_total_replays_total[5m]) < 0.95
        for: 1m
        labels:
          severity: critical
          service: determinism-service
        annotations:
          summary: "Determinism success rate is critically low"
          description: "The determinism success rate has fallen to {{ $value | humanizePercentage }} for more than 1 minute."

      # Performance Budget Alerts
      - alert: PerformanceBudgetViolationHigh
        expr: rate(performance_budget_violations_total[5m]) / rate(determinism_total_replays_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: determinism-service
        annotations:
          summary: "Performance budget violations are high"
          description: "{{ $value | humanizePercentage }} of replays are violating the performance budget."

      - alert: PerformanceBudgetViolationCritical
        expr: rate(performance_budget_violations_total[5m]) / rate(determinism_total_replays_total[5m]) > 0.20
        for: 2m
        labels:
          severity: critical
          service: determinism-service
        annotations:
          summary: "Performance budget violations are critically high"
          description: "{{ $value | humanizePercentage }} of replays are violating the performance budget."

      # Invariant Violation Alerts
      - alert: InvariantViolationsDetected
        expr: rate(invariant_violations_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: determinism-service
        annotations:
          summary: "Invariant violations detected"
          description: "{{ $value }} invariant violations per second detected."

      # Clock Skew Alerts
      - alert: ClockSkewToleranceExceeded
        expr: rate(clock_skew_tolerance_exceeded_total[5m]) > 0
        for: 2m
        labels:
          severity: high
          service: determinism-service
        annotations:
          summary: "Clock skew tolerance exceeded"
          description: "Clock skew is exceeding tolerance limits at a rate of {{ $value }} events per second."

      # Service Health Alerts
      - alert: DeterminismServiceDown
        expr: up{job="determinism-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: determinism-service
        annotations:
          summary: "Determinism service is down"
          description: "The determinism service has been down for more than 1 minute."

      - alert: DeterminismServiceHighLatency
        expr: histogram_quantile(0.95, rate(determinism_replay_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: determinism-service
        annotations:
          summary: "High replay latency detected"
          description: "95th percentile replay latency is {{ $value }}s, which is above the 100ms threshold."

      # Memory and Resource Alerts
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / process_virtual_memory_max_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
          service: determinism-service
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | humanizePercentage }} of available memory."

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{state="open"} > 0
        for: 0m
        labels:
          severity: warning
          service: determinism-service
        annotations:
          summary: "Circuit breaker is open"
          description: "The performance circuit breaker is open, indicating system protection is active."

  - name: business_logic
    interval: 60s
    rules:
      # Business Logic Health
      - alert: DeterminismTrendDegrading
        expr: (
          rate(determinism_successful_replays_total[1h]) / rate(determinism_total_replays_total[1h]) 
        ) - (
          rate(determinism_successful_replays_total[6h] offset 1h) / rate(determinism_total_replays_total[6h] offset 1h)
        ) < -0.02
        for: 10m
        labels:
          severity: warning
          service: determinism-service
        annotations:
          summary: "Determinism success rate is trending downward"
          description: "Success rate has decreased by more than 2% compared to the previous period."

      - alert: ReplayVolumeUnusuallyLow
        expr: rate(determinism_total_replays_total[1h]) < rate(determinism_total_replays_total[6h] offset 6h) * 0.5
        for: 15m
        labels:
          severity: warning
          service: determinism-service
        annotations:
          summary: "Replay volume is unusually low"
          description: "Current replay rate is less than 50% of the historical average."

      - alert: SamplingRateTooLow
        expr: avg_over_time(performance_sampling_rate[10m]) < 0.05
        for: 5m
        labels:
          severity: info
          service: determinism-service
        annotations:
          summary: "Performance sampling rate is very low"
          description: "Current sampling rate is {{ $value | humanizePercentage }}, which may reduce monitoring effectiveness."