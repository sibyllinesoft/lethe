services:
  etcd:
    environment:
    - ETCD_AUTO_COMPACTION_MODE=revision
    - ETCD_AUTO_COMPACTION_RETENTION=1000
    - ETCD_QUOTA_BACKEND_BYTES=4294967296
    image: quay.io/coreos/etcd:v3.5.0
    volumes:
    - etcd_data:/etcd
  lethe-hybrid:
    build:
      context: .
      dockerfile: Dockerfile.lethe
    environment:
    - LETHE_MODE=hybrid
    - POOL_PATH=/app/pools/frozen_pool_v1.jsonl
    - CONFIG_PATH=/app/configs/hybrid.json
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      timeout: 10s
    ports:
    - 8080:8080
    volumes:
    - ./pools:/app/pools:ro
    - ./configs:/app/configs:ro
  milvus:
    depends_on:
    - etcd
    - minio
    environment:
    - ETCD_ENDPOINTS=etcd:2379
    - MINIO_ADDRESS=minio:9000
    image: milvusdb/milvus:v2.3.0
    ports:
    - 19530:19530
  minio:
    command: server /data --console-address ':9001'
    environment:
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    ports:
    - 9001:9001
    - 9000:9000
    volumes:
    - minio_data:/data
  validator:
    build:
      context: .
      dockerfile: Dockerfile.validator
    environment:
    - VALIDATION_MODE=strict
    volumes:
    - ./runs:/app/runs:ro
    - ./validators:/app/validators:ro
  weaviate:
    environment:
    - QUERY_DEFAULTS_LIMIT=25
    - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
    - PERSISTENCE_DATA_PATH=/var/lib/weaviate
    - DEFAULT_VECTORIZER_MODULE=none
    image: weaviate/weaviate:1.25.0
    ports:
    - 8081:8080
    volumes:
    - weaviate_data:/var/lib/weaviate
  zoekt:
    build:
      context: .
      dockerfile: Dockerfile.zoekt
    environment:
    - ZOEKT_INDEX_PATH=/data/zoekt_index
    ports:
    - 6070:6070
    volumes:
    - ./pools:/data:ro
version: '3.8'
volumes:
- 'weaviate_data:'
- 'etcd_data:'
- 'minio_data:'
