# Comprehensive Benchmark Configuration
# ===================================

# Run identification
run_name: "comprehensive_benchmark_v1"
experiment_tags: 
  - "comprehensive"
  - "fair-evaluation"
  - "statistical-rigor"
  - "production-ready"

# System settings
random_seed: 42
log_level: "INFO"
max_workers: 4
dry_run: false

# Competitor and dataset selection (empty = all)
enabled_competitors: []  # All competitors
enabled_datasets: []     # All datasets

# Evaluation configuration
evaluation:
  # Budget constraints - matched across all competitors
  keep_ratios: [0.08, 0.15, 0.30]
  
  # Metrics to compute
  metrics:
    - "precision_at_k"
    - "recall_at_k"
    - "delta_cbu_per_1k"      # Context Budget Units per 1k
    - "middleware_p95"        # 95th percentile latency
    - "middleware_p99"        # 99th percentile latency
    - "kv_reuse_rate"         # Cache efficiency
    - "tail_cvar"             # Tail conditional value at risk
    - "exact_match"           # Exact answer matching
    - "entity_diversity"      # Entity coverage diversity
  
  # Statistical testing configuration
  statistical_testing:
    bootstrap_iterations: 1000      # Bootstrap resampling
    permutation_iterations: 1000    # Permutation tests
    confidence_level: 0.95          # 95% confidence intervals
    correction_method: "holm"       # Multiple comparison correction
    effect_size_threshold: 0.1     # Practical significance threshold
  
  # Performance profiling
  latency_percentiles: [0.5, 0.95, 0.99]
  memory_profiling: true
  cpu_profiling: true
  
  # Quality gates
  quality_thresholds:
    min_recall_at_10: 0.1
    max_latency_p99_ms: 5000.0
    max_memory_gb: 16.0

# Infrastructure configuration
infrastructure:
  # Docker settings
  docker_compose_path: "benchmarks/docker-compose.benchmark.yml"
  container_registry: "ghcr.io/lethe-research"
  max_parallel_containers: 4
  container_memory_limit: "8g"
  container_cpu_limit: "4.0"
  
  # Storage
  results_dir: "benchmark_results"
  logs_dir: "benchmark_logs"
  cache_dir: "benchmark_cache"
  
  # Networking
  api_timeout_seconds: 300
  retry_backoff_seconds: 2.0
  
  # Resource monitoring
  monitor_resources: true
  resource_check_interval_seconds: 30
  
  # Cleanup
  auto_cleanup_containers: true
  preserve_failed_containers: true  # For debugging

# Reporting configuration
reporting:
  # Output formats
  generate_html: true
  generate_pdf: false  # Requires additional dependencies
  generate_json: true
  generate_csv: true
  
  # HTML report features
  interactive_charts: true
  scenario_cards: true
  advantage_map: true
  raw_data_links: true
  
  # Marketing content
  include_competitor_strengths: true
  include_failure_buckets: true      # Honest assessment
  include_config_snippets: true
  vendor_documentation_links: true
  
  # Statistical presentation
  show_confidence_intervals: true
  show_effect_sizes: true
  show_significance_tests: true
  highlight_improvements: true
  
  # Report customization
  company_branding: true
  custom_css_path: null
  logo_path: null