# Lethe Production Monitoring Stack
# Complete monitoring infrastructure for TODO.md instrumentation requirements

version: '3.8'

services:
  # PostgreSQL database for metrics storage
  postgres:
    image: postgres:15-alpine
    container_name: lethe-postgres
    environment:
      POSTGRES_DB: lethe_monitoring
      POSTGRES_USER: lethe_user
      POSTGRES_PASSWORD: lethe_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup_monitoring.sql:/docker-entrypoint-initdb.d/setup_monitoring.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lethe_user -d lethe_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for parameter drift tracking and caching
  redis:
    image: redis:7-alpine
    container_name: lethe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: lethe-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  # Grafana for dashboard visualization  
  grafana:
    image: grafana/grafana:latest
    container_name: lethe-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_dashboard.json:/etc/grafana/provisioning/dashboards/lethe-dashboard.json:ro
      - ./grafana_datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus

  # AlertManager for alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: lethe-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  # Main production dashboard
  lethe-dashboard:
    build: .
    container_name: lethe-dashboard
    ports:
      - "8080:8080"  # Dashboard API
      - "9091:9091"  # Prometheus metrics
    environment:
      DATABASE_URL: postgresql://lethe_user:lethe_pass@postgres:5432/lethe_monitoring
      REDIS_URL: redis://redis:6379
      PROMETHEUS_PORT: 9091
      LOG_LEVEL: INFO
    volumes:
      - ./production_config.yaml:/app/production_config.yaml:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Canary controller service
  canary-controller:
    build: 
      context: .
      dockerfile: Dockerfile.canary
    container_name: lethe-canary-controller
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://lethe_user:lethe_pass@postgres:5432/lethe_monitoring
      REDIS_URL: redis://redis:6379
    volumes:
      - ./canary_config.yaml:/app/canary_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Log aggregator (optional)
  loki:
    image: grafana/loki:latest
    container_name: lethe-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # Log shipper
  promtail:
    image: grafana/promtail:latest
    container_name: lethe-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/lethe:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local

networks:
  default:
    name: lethe-monitoring
    driver: bridge