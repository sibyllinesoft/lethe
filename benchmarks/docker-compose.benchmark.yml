version: '3.8'

services:
  # Hybrid Vector DBs
  weaviate:
    image: semitechnologies/weaviate:1.22.4
    restart: on-failure:0
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai,generative-openai'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    labels:
      - "benchmark.competitor=weaviate"
      - "benchmark.category=hybrid_vector_db"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.2
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - "milvus-etcd"
      - "milvus-minio"
    labels:
      - "benchmark.competitor=milvus"
      - "benchmark.category=hybrid_vector_db"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  vespa:
    image: vespaengine/vespa:8.247.17
    ports:
      - "8081:8080"
      - "19071:19071"
    volumes:
      - vespa_data:/opt/vespa/var
    labels:
      - "benchmark.competitor=vespa"
      - "benchmark.category=hybrid_vector_db"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ApplicationStatus"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    labels:
      - "benchmark.competitor=opensearch"
      - "benchmark.category=hybrid_vector_db"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  # Learned Sparse/Late-Interaction
  splade-v2:
    image: naver/splade:v2.2.0
    ports:
      - "8082:8080"
    environment:
      - MODEL_NAME=naver/splade-cocondenser-ensembledistil
      - DEVICE=cuda
    volumes:
      - splade_cache:/root/.cache
    labels:
      - "benchmark.competitor=splade_v2"
      - "benchmark.category=learned_sparse"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  colbert-v2:
    image: stanford/colbert:v2.0
    ports:
      - "8083:8080"
    environment:
      - MODEL_NAME=colbert-ir/colbertv2.0
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - colbert_cache:/root/.cache
      - colbert_index:/colbert/indexes
    labels:
      - "benchmark.competitor=colbert_v2"
      - "benchmark.category=learned_sparse"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  ragatouille:
    image: bclavie/ragatouille:0.0.7
    ports:
      - "8084:8080"
    environment:
      - MODEL_NAME=colbert-ir/colbertv2.0
    volumes:
      - ragatouille_cache:/root/.cache
      - ragatouille_index:/ragatouille/indexes
    labels:
      - "benchmark.competitor=ragatouille"
      - "benchmark.category=learned_sparse"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  # Open Rerankers
  bge-reranker-large:
    image: flagopen/bge-reranker:large-v1.5
    ports:
      - "8085:8080"
    environment:
      - MODEL_NAME=BAAI/bge-reranker-large
      - MAX_LENGTH=512
    volumes:
      - bge_cache:/root/.cache
    labels:
      - "benchmark.competitor=bge_reranker_large"
      - "benchmark.category=reranker"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  bge-m3-reranker:
    image: flagopen/bge-m3:v1.0
    ports:
      - "8086:8080"
    environment:
      - MODEL_NAME=BAAI/bge-m3
      - USE_FP16=true
    volumes:
      - bge_m3_cache:/root/.cache
    labels:
      - "benchmark.competitor=bge_m3_reranker"
      - "benchmark.category=reranker"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  monot5:
    image: castorini/monot5:3b
    ports:
      - "8087:8080"
    environment:
      - MODEL_NAME=castorini/monot5-3b-msmarco-10k
      - TOKENIZER_NAME=t5-3b
    volumes:
      - monot5_cache:/root/.cache
    labels:
      - "benchmark.competitor=monot5"
      - "benchmark.category=reranker"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  # Code Search & Graph
  zoekt-indexserver:
    image: sourcegraph/zoekt-indexserver:3.4.0
    ports:
      - "6070:6070"
    volumes:
      - zoekt_index:/data/index
    labels:
      - "benchmark.competitor=zoekt"
      - "benchmark.category=code_search"
    mem_limit: 4g
    cpus: 2.0

  zoekt-webserver:
    image: sourcegraph/zoekt-webserver:3.4.0
    ports:
      - "8088:8080"
    volumes:
      - zoekt_index:/data/index
    depends_on:
      - zoekt-indexserver
    labels:
      - "benchmark.competitor=zoekt"
      - "benchmark.category=code_search"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 4g
    cpus: 2.0

  livegrep:
    image: livegrep/livegrep:latest
    ports:
      - "8089:8910"
    volumes:
      - livegrep_index:/livegrep/index
    labels:
      - "benchmark.competitor=livegrep"
      - "benchmark.category=code_search"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8910/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 4g
    cpus: 2.0

  graphrag:
    image: microsoft/graphrag:0.1.0
    ports:
      - "8090:8080"
    environment:
      - LLM_MODEL=gpt-4o-mini
      - EMBEDDING_MODEL=text-embedding-3-small
    volumes:
      - graphrag_data:/graphrag/data
    labels:
      - "benchmark.competitor=graphrag"
      - "benchmark.category=code_search"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  # Long-Context Algorithms
  streaming-llm:
    image: mit-han-lab/streaming-llm:latest
    ports:
      - "8091:8080"
    environment:
      - MODEL_NAME=meta-llama/Llama-2-7b-chat-hf
      - ATTENTION_SINK_SIZE=4
      - RECENT_SIZE=2000
    volumes:
      - streaming_llm_cache:/root/.cache
    labels:
      - "benchmark.competitor=streaming_llm"
      - "benchmark.category=long_context"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 16g
    cpus: 4.0

  longnet:
    image: microsoft/longnet:1.0
    ports:
      - "8092:8080"
    environment:
      - MODEL_NAME=microsoft/DialoGPT-medium
      - SEGMENT_SIZE=2048
    volumes:
      - longnet_cache:/root/.cache
    labels:
      - "benchmark.competitor=longnet"
      - "benchmark.category=long_context"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 16g
    cpus: 4.0

  bge-m3-baseline:
    image: flagopen/bge-m3:v1.0
    ports:
      - "8093:8080"
    environment:
      - MODEL_NAME=BAAI/bge-m3
      - POOLING_METHOD=cls
      - MAX_LENGTH=8192
    volumes:
      - bge_m3_baseline_cache:/root/.cache
    labels:
      - "benchmark.competitor=bge_m3_baseline"
      - "benchmark.category=long_context"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

  # Lethe Baseline (local build)
  lethe-hybrid:
    build:
      context: ../ctx-run/packages/sqlite
      dockerfile: Dockerfile
    ports:
      - "8094:8080"
    environment:
      - PLANNING_STRATEGY=adaptive
      - FUSION_ALPHA=dynamic
      - DIVERSIFICATION_ENABLED=true
      - RERANKING_ENABLED=false
      - TARGET_LATENCY_MS=200
    volumes:
      - lethe_data:/app/data
    labels:
      - "benchmark.competitor=lethe_hybrid"
      - "benchmark.category=baseline"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 8g
    cpus: 4.0

volumes:
  # Hybrid Vector DBs
  weaviate_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  vespa_data:
  opensearch_data:
  
  # Learned Sparse/Late-Interaction
  splade_cache:
  colbert_cache:
  colbert_index:
  ragatouille_cache:
  ragatouille_index:
  
  # Rerankers
  bge_cache:
  bge_m3_cache:
  monot5_cache:
  
  # Code Search
  zoekt_index:
  livegrep_index:
  graphrag_data:
  
  # Long Context
  streaming_llm_cache:
  longnet_cache:
  bge_m3_baseline_cache:
  
  # Lethe
  lethe_data:

networks:
  default:
    name: benchmark_network
    driver: bridge